<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Kinnred — meet people nearby for activities, friends, dating, and networking." />
    <title>Kinnred</title>

    <!--
      Same two families the Lovable prototype loads. Fraunces is the display
      serif used for page titles; Inter is the UI face. Weights are limited to
      the ones src/theme/typography.js actually asks for.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
      /* The design is a fixed-width phone column; horizontal scroll is never wanted. */
      body { overscroll-behavior-y: none; }
    </style>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
